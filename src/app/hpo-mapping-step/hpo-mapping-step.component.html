<dialog #nativeMappingDialog class="hpo-modal" (cancel)="cancel()">
  <div class="modal-content">
    <header class="modal-header">
      <h3>Map Value Symbols for: {{ header() }}</h3>
      <button class="close-btn" type="button" (click)="cancel()">&times;</button>
    </header>

    <main class="modal-body">
      <p class="hpo-badge">Term: <strong>{{ hpoLabel() }}</strong> <code>{{ hpoId() }}</code></p>
      <div class="mapping-grid">
        @for (value of uniqueValues(); track value) {
          <div class="mapping-card">
            <div class="card-header">
              <span class="raw-value" [title]="value">{{ value || '(Empty String)' }}</span>
            </div>

            <div class="tile-options-group">
              <button
                type="button"
                class="tile-btn observed-tile"
                [class.active]="currentCellValue(value).type === 'Observed'"
                (click)="setQuickState(value, 'Observed')">
                <span class="tile-icon">✓</span>
                <span class="tile-label">Observed</span>
              </button>

              <button
                type="button"
                class="tile-btn excluded-tile"
                [class.active]="currentCellValue(value).type === 'Excluded'"
                (click)="setQuickState(value, 'Excluded')">
                <span class="tile-icon">✕</span>
                <span class="tile-label">Excluded</span>
              </button>

              <button
                type="button"
                class="tile-btn na-tile"
                [class.active]="currentCellValue(value).type === 'Na'"
                (click)="setQuickState(value, 'Na')">
                <span class="tile-icon">−</span>
                <span class="tile-label">N/A</span>
              </button>

              <button
                type="button"
                class="tile-btn detail-tile"
                [class.active]="currentCellValue(value).type === 'OnsetAge'"
                (click)="toggleEditor(value)">
                <span class="tile-icon">🕒</span>
                @let cell = currentCellValue(value);
                <span class="tile-label">
                  {{ cell.type === 'OnsetAge' ? ('Onset: ' + cell.data) : 'Details…' }}
                </span>
              </button>
            </div>

            @if (activeEditValue(); as value) {
              <dialog #detailDialog class="cell-detail-modal" (cancel)="closeEditor()" (close)="closeEditor()">
                <div class="modal-content">
                  <header class="modal-header">
                    <span>Edit details for "{{ value }}"</span>
                    <button type="button" class="close-btn" (click)="closeEditor()">&times;</button>
                  </header>

                  <app-hpo-annotation-panel
                    [cellData]="currentCellValue(value)"
                    [columnTitle]="header()"
                    [filterModifiersFn]="filterModifiers"
                    [initModifiersFn]="initModifiers"
                    [getModifierLabelFn]="getModifierLabel"
                    (dataChanged)="onCellDetailChanged(value, $event)"
                    (requestNewOnset)="openGlobalAgeDialog()"
                  />

                  @if (showAgeDialog()) {
                    <div class="backdrop-modal" (click)="closeAgeDialog()"></div>
                    <div class="modal-container" (click)="$event.stopPropagation()">
                      @let cell = currentCellValue(value);
                      <app-addage
                        [current]="cell.type === 'OnsetAge' ? cell.data : ''"
                        (saved)="handleAgeSaved($event)"
                        (cancelled)="closeAgeDialog()"
                      />
                    </div>
                  }

                  <footer class="modal-footer">
                    <button type="button" class="btn-secondary" (click)="cancelEditor()">Cancel</button>
                    <button type="button" class="btn-primary" (click)="confirmEditor()">Confirm</button>
                  </footer>
                </div>
              </dialog>
            }
          </div>
        }
      </div>
    </main>

    <footer class="modal-footer">
      <button class="btn-secondary" type="button" (click)="cancel()">Cancel</button>
      <button class="btn-primary" type="button" (click)="confirm()">Apply Transformation</button>
    </footer>
  </div>
</dialog>
